<!DOCTYPE html>
<html lang="en" class="chat-html h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>Sarthi AI — Scora</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:         '#0D1F35',
            'navy-light': '#1A3352',
            'navy-dark':  '#071424',
            indigo:       '#5B4CF5',
            'indigo-light':'#7C70F8',
            'indigo-dark': '#3B2FD9',
            amber:        '#F59E0B',
            'amber-dark': '#D97706',
            paper:        '#FAFAF9',
            ink:          '#0D1F35',
            'ink-soft':   '#5E6E84',
            'ink-faint':  '#94A3B8',
            pen:          '#E11D48',
            'pen-light':  '#FB7185',
            success:      '#059669',
            'success-light':'#34D399',
            line:         '#E4E8EF',
            'line-soft':  '#F1F4F9',
          },
          fontFamily: { serif: ['Fraunces', 'serif'], sans: ['Inter', 'sans-serif'] },
          boxShadow: {
            'indigo-glow': '0 0 24px rgba(91, 76, 245, 0.40)',
            'amber-glow':  '0 0 18px rgba(245, 158, 11, 0.45)',
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --app-height: 100dvh;
    }
    html.chat-html,
    body.chat-body {
      height: 100% !important;
      height: var(--app-height, 100dvh) !important;
      min-height: 0 !important;
      max-height: var(--app-height, 100dvh) !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      position: relative !important;
    }
    #messages { scroll-behavior: smooth; }
    .typing-dot { animation: bounce 1s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
  </style>
  <script>
    (function() {
      function syncVh() {
        var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-height', h + 'px');
        if (document.body && document.body.classList.contains('chat-body')) {
          document.body.style.height = h + 'px';
        }
      }
      syncVh();
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncVh);
        window.visualViewport.addEventListener('scroll', syncVh);
      }
      window.addEventListener('resize', syncVh);
    })();
  </script>
</head>
<body class="chat-body font-sans bg-paper text-ink flex flex-col h-full w-full overflow-hidden">

  <!-- Header -->
  <div class="border-b border-line bg-white px-4 sm:px-5 py-3 shrink-0 shadow-sm z-10">
    <div class="max-w-2xl mx-auto w-full flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="w-9 h-9 rounded-full bg-line-soft flex items-center justify-center text-ink-soft hover:text-navy hover:bg-line transition">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-full gradient-hero text-paper flex items-center justify-center font-serif text-lg font-bold shadow-sm relative">
            S
            <span class="w-3 h-3 rounded-full bg-success border-2 border-white absolute bottom-0 right-0"></span>
          </div>
          <div>
            <h1 class="font-serif text-base font-bold text-navy leading-tight">Sarthi AI</h1>
            <p class="text-[11px] text-ink-soft flex items-center gap-1 font-medium">
              <span>10th SSC Doubt Solver</span> • <span class="text-success font-semibold">Online</span>
            </p>
          </div>
        </div>
      </div>

      <button id="clear-chat-btn" class="text-xs text-ink-soft hover:text-pen font-medium px-2.5 py-1 rounded-lg border border-line hover:border-pen/30 transition">
        Clear History
      </button>
    </div>
  </div>

  <!-- Subject Chips bar -->
  <div class="px-4 sm:px-5 py-2.5 border-b border-line bg-white/60 shrink-0 overflow-x-auto">
    <div class="max-w-2xl mx-auto">
      <div id="subject-chips" class="flex gap-2 w-max"></div>
    </div>
  </div>

  <!-- Quick Prompts Banner (Shown when starting chat) -->
  <div id="prompt-suggestions" class="px-4 sm:px-5 py-2.5 bg-indigo/5 border-b border-line shrink-0 overflow-x-auto">
    <div class="max-w-2xl mx-auto">
      <div class="flex items-center gap-2 text-xs w-max">
        <span class="font-bold text-indigo text-[11px] uppercase tracking-wider">Try Asking:</span>
        <button class="suggestion-chip bg-white border border-line px-3 py-1 rounded-full text-ink-soft hover:border-indigo hover:text-indigo transition font-medium">
          📐 Explain Pythagoras Theorem step by step
        </button>
        <button class="suggestion-chip bg-white border border-line px-3 py-1 rounded-full text-ink-soft hover:border-indigo hover:text-indigo transition font-medium">
          🧪 Explain Periodic Table Trends (Science 1)
        </button>
        <button class="suggestion-chip bg-white border border-line px-3 py-1 rounded-full text-ink-soft hover:border-indigo hover:text-indigo transition font-medium">
          ✍️ How to write 5-mark History answers?
        </button>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div id="messages" class="flex-1 min-h-0 overflow-y-auto px-4 sm:px-6 py-4 space-y-4 max-w-2xl mx-auto w-full"></div>

  <!-- Image preview (shown when attached) -->
  <div id="image-preview-bar" class="hidden px-4 sm:px-5 pb-2 shrink-0 bg-white border-t border-line pt-2">
    <div class="max-w-2xl mx-auto">
      <div class="relative w-fit">
        <img id="image-preview" class="h-16 rounded-xl border border-line shadow-sm" />
        <button id="remove-image" class="absolute -top-2 -right-2 w-5 h-5 bg-pen text-paper rounded-full flex items-center justify-center text-xs font-bold shadow">✕</button>
      </div>
    </div>
  </div>

  <!-- Input bar -->
  <div id="chat-input-bar" class="border-t border-line bg-white shrink-0 shadow-lg z-20" style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom, 0px));">
    <form id="chat-form" class="max-w-2xl mx-auto px-3 sm:px-4 py-2 sm:py-2.5 flex items-end gap-2">
      <label title="Attach Textbook/Homework Photo" class="shrink-0 w-10 h-10 rounded-full border border-line flex items-center justify-center cursor-pointer text-ink-soft hover:bg-paper hover:text-navy transition active:scale-95">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <circle cx="8.5" cy="10" r="1.5"/>
          <path d="M21 15l-5-5-9 9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input type="file" id="image-input" accept="image/*" class="hidden" />
      </label>

      <textarea id="chat-input" rows="1" enterkeyhint="send" placeholder="Ask any 10th SSC doubt or send homework photo…"
        class="flex-1 resize-none px-4 py-2.5 border border-line rounded-2xl text-base sm:text-sm bg-paper/40
               focus:border-navy focus:ring-1 focus:ring-navy outline-none max-h-32 transition leading-relaxed"></textarea>

      <button type="submit" id="send-btn" title="Send message (Enter)" class="shrink-0 w-10 h-10 rounded-full bg-indigo text-white flex items-center justify-center hover:bg-indigo-light active:scale-95 transition shadow-md shadow-indigo/25">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script type="module" src="js/chat.js"></script>
</body>
</html>
