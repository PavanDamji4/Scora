<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Scora</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:         '#0D1F35',
            'navy-light': '#1A3352',
            'navy-dark':  '#071424',
            indigo:       '#5B4CF5',
            'indigo-light':'#7C70F8',
            'indigo-dark': '#3B2FD9',
            amber:        '#F59E0B',
            'amber-dark': '#D97706',
            paper:        '#FAFAF9',
            ink:          '#0D1F35',
            'ink-soft':   '#5E6E84',
            'ink-faint':  '#94A3B8',
            pen:          '#E11D48',
            'pen-light':  '#FB7185',
            success:      '#059669',
            'success-light':'#34D399',
            line:         '#E4E8EF',
            'line-soft':  '#F1F4F9',
          },
          fontFamily: { serif: ['Fraunces', 'serif'], sans: ['Inter', 'sans-serif'] },
          boxShadow: {
            'indigo-glow': '0 0 24px rgba(91, 76, 245, 0.40)',
            'amber-glow':  '0 0 18px rgba(245, 158, 11, 0.45)',
          },
        },
      },
    };
  </script>
</head>
<body class="font-sans bg-paper text-ink min-h-screen pb-28">

  <div class="max-w-md sm:max-w-lg mx-auto px-5 pt-8">

    <!-- Notification permission banner (injected by notifications.js) -->
    <div id="dashboard-banner-root"></div>

    <!-- Header with Profile Initial Avatar -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <p id="greeting" class="text-ink-soft text-xs font-semibold uppercase tracking-wider">Good morning</p>
        <h1 id="student-name" class="font-serif text-2xl text-navy font-bold">—</h1>
        <p id="student-school" class="text-xs text-ink-soft mt-0.5 font-medium">—</p>
      </div>
      <a href="settings.html" title="Settings & Profile" class="flex items-center justify-center">
        <div id="profile-initial-badge" class="w-11 h-11 rounded-full bg-navy text-paper flex items-center justify-center font-serif text-xl font-bold shadow-sm hover:bg-navy-light transition border-2 border-white">
          —
        </div>
      </a>
    </div>

    <!-- Exam countdown hero -->
    <div class="gradient-navy rounded-2xl px-6 py-6 mb-6 text-paper relative overflow-hidden shadow-lg shadow-navy/25 ruled-bg">
      <div class="flex items-center justify-between mb-3">
        <span class="text-paper/70 text-[11px] font-semibold uppercase tracking-wider flex items-center gap-1.5">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          SSC Board Exam Countdown
        </span>
        <a href="settings.html" class="text-[11px] text-paper/80 bg-paper/10 hover:bg-paper/20 px-2.5 py-1 rounded-full border border-paper/20 transition">
          Edit Date
        </a>
      </div>

      <div class="flex items-baseline gap-2.5 mb-2">
        <span id="countdown-number" class="font-serif text-5xl sm:text-6xl font-bold leading-none text-paper">—</span>
        <span id="countdown-label" class="text-paper/80 text-base font-medium">days to go</span>
      </div>

      <div class="h-2 w-full bg-paper/15 rounded-full overflow-hidden mb-3">
        <div id="countdown-progress-bar" class="h-full bg-gradient-to-r from-amber to-amber-dark rounded-full transition-all duration-700" style="width: 70%"></div>
      </div>

      <p id="countdown-subtext" class="text-paper/60 text-xs">Targeting March 2027 SSC Board Exams</p>

      <!-- Decorative indigo glow blob -->
      <div class="absolute -top-6 -right-6 w-28 h-28 rounded-full bg-indigo/20 blur-2xl pointer-events-none"></div>
    </div>

    <!-- Quick access -->
    <div class="grid grid-cols-2 gap-3.5 mb-6">
      <a href="vault.html" class="border border-line rounded-2xl p-4 hover:border-indigo/30 transition bg-white shadow-sm hover:shadow-md card-hover group">
        <div class="w-10 h-10 rounded-xl bg-indigo/8 text-indigo flex items-center justify-center mb-3 group-hover:bg-indigo group-hover:text-white transition-colors">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
            <path d="M8 9h8M8 13h8M8 17h4" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="font-bold text-sm text-navy">Study Vault</p>
        <p class="text-xs text-ink-soft mt-0.5">Workbooks, Journals & 3Y PYQs</p>
      </a>

      <a href="tracker.html" class="border border-line rounded-2xl p-4 hover:border-amber/40 transition bg-white shadow-sm hover:shadow-md card-hover group">
        <div class="w-10 h-10 rounded-xl bg-amber/10 text-amber-dark flex items-center justify-center mb-3 group-hover:bg-amber group-hover:text-white transition-colors">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="4" width="18" height="17" rx="2"/>
            <path d="M8 13.5l2 2 4-4.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="font-bold text-sm text-navy">Tracker</p>
        <p class="text-xs text-ink-soft mt-0.5">30-Day Consistency Grid</p>
      </a>
    </div>

    <!-- Today's tasks preview -->
    <div class="mb-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-serif text-lg font-bold text-navy">Today's Study Checklist</h2>
        <a href="tracker.html" class="text-xs font-semibold text-navy hover:underline">Manage Tracker →</a>
      </div>
      <div id="tasks-preview" class="space-y-2.5">
        <p class="text-sm text-ink-soft border border-dashed border-line rounded-2xl px-4 py-6 text-center bg-white/60">
          Loading tasks…
        </p>
      </div>
    </div>

  </div>

  <div id="bottom-nav-root"></div>
  <div id="chat-fab-root"></div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
