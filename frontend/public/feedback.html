<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback & Suggestions — Scora</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:         '#0D1F35',
            'navy-light': '#1A3352',
            'navy-dark':  '#071424',
            indigo:       '#5B4CF5',
            'indigo-light':'#7C70F8',
            'indigo-dark': '#3B2FD9',
            amber:        '#F59E0B',
            'amber-dark': '#D97706',
            paper:        '#FAFAF9',
            ink:          '#0D1F35',
            'ink-soft':   '#5E6E84',
            'ink-faint':  '#94A3B8',
            pen:          '#E11D48',
            'pen-light':  '#FB7185',
            success:      '#059669',
            'success-light':'#34D399',
            line:         '#E4E8EF',
            'line-soft':  '#F1F4F9',
          },
          fontFamily: { serif: ['Fraunces', 'serif'], sans: ['Inter', 'sans-serif'] },
        },
      },
    };
  </script>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="font-sans bg-paper text-ink min-h-screen pb-24">

  <div class="max-w-md sm:max-w-lg mx-auto px-5 pt-8">

    <!-- Header -->
    <div class="flex items-center gap-3 mb-6">
      <a href="settings.html" class="w-9 h-9 rounded-full bg-white border border-line flex items-center justify-center text-ink-soft hover:text-navy transition shadow-sm">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <div>
        <h1 class="font-serif text-2xl font-bold text-navy">Student Feedback & Support</h1>
        <p class="text-xs text-ink-soft">Share advice, suggest features, or report an issue.</p>
      </div>
    </div>

    <!-- Form container -->
    <div class="bg-white border border-line rounded-2xl p-6 shadow-sm mb-6">

      <div id="success-banner" class="hidden text-center py-8">
        <div class="w-14 h-14 rounded-full bg-success/10 text-success flex items-center justify-center mx-auto mb-3 text-2xl">
          ✓
        </div>
        <h2 class="font-serif text-xl font-bold text-navy mb-1">Thank you for your feedback!</h2>
        <p class="text-xs text-ink-soft max-w-xs mx-auto mb-6">Your suggestion has been submitted. We are continuously improving Scora to help 10th SSC students excel!</p>
        <a href="settings.html" class="inline-block bg-navy text-paper px-5 py-2.5 rounded-xl text-xs font-semibold hover:bg-navy-light transition shadow-sm">
          Return to Settings
        </a>
      </div>

      <form id="feedback-form" class="space-y-4">

        <div>
          <label for="feedback-type" class="block text-xs font-semibold uppercase tracking-wider text-ink mb-1">Feedback Category</label>
          <select id="feedback-type" required
            class="w-full px-3.5 py-2.5 border border-line rounded-xl text-sm bg-paper/30 focus:border-navy focus:ring-1 focus:ring-navy outline-none">
            <option value="Advice & Suggestion" selected>💡 General Advice / Feature Suggestion</option>
            <option value="Study Material Request">📚 Request Specific Workbooks or Papers</option>
            <option value="Bug / Issue Report">⚠️ Report a Problem or Bug</option>
            <option value="Other">💬 Other Feedback</option>
          </select>
        </div>

        <div>
          <label for="feedback-subject" class="block text-xs font-semibold uppercase tracking-wider text-ink mb-1">Topic / Subject</label>
          <input type="text" id="feedback-subject" required placeholder="e.g. Add Geometry formula flashcards"
            class="w-full px-3.5 py-2.5 border border-line rounded-xl text-sm bg-paper/30 focus:border-navy focus:ring-1 focus:ring-navy outline-none" />
        </div>

        <div>
          <label for="feedback-message" class="block text-xs font-semibold uppercase tracking-wider text-ink mb-1">Your Message / Feedback</label>
          <textarea id="feedback-message" rows="5" required placeholder="Tell us what features or improvements will help you prepare better for 10th SSC Board Exams..."
            class="w-full px-3.5 py-2.5 border border-line rounded-xl text-sm bg-paper/30 focus:border-navy focus:ring-1 focus:ring-navy outline-none resize-none"></textarea>
        </div>

        <button type="submit" id="submit-feedback-btn"
          class="w-full bg-navy text-paper py-3 rounded-xl text-sm font-semibold shadow-md shadow-navy/20 hover:bg-navy-light transition active:scale-[0.99] flex items-center justify-center gap-2">
          Submit Feedback
        </button>

      </form>
    </div>

  </div>

  <div id="bottom-nav-root"></div>
  <div id="chat-fab-root"></div>

  <script type="module" src="js/feedback.js"></script>
</body>
</html>
